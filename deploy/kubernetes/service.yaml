apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: banking-simulator
spec:
  type: ClusterIP
  selector:
    app: banking-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: banking-simulator
spec:
  type: ClusterIP
  selector:
    app: banking-redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: banking-simulator
spec:
  type: ClusterIP
  selector:
    app: banking-backend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: banking-simulator
spec:
  type: NodePort
  selector:
    app: banking-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30081
