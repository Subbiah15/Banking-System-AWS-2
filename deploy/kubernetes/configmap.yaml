apiVersion: v1
kind: ConfigMap
metadata:
  name: banking-config
  namespace: banking-simulator
data:
  SPRING_PROFILES_ACTIVE: "prod"
  POSTGRES_DB: "banking"
  POSTGRES_USER: "banking"
  DB_URL: "jdbc:postgresql://postgres:5432/banking"
  DB_USERNAME: "banking"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  EVENTS_ENABLED: "false"
  SEED_DEMO: "false"
  CORS_ALLOWED_ORIGINS: "http://localhost:5173"
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
  MANAGEMENT_HEALTH_KAFKA_ENABLED: "false"
